name = "table-cloner"
packages = [ "legoeducation==1.0.6" ]

# The hub / Bluetooth / joystick code is shared with the Trainer (trainer/...).
# state.py and sync.py are the Cloner's own small versions of the modules Device.py expects.
[files]
"./trainer/Device.py" = "./Device.py"
"./trainer/network/link_logic.py" = "./link_logic.py"
"./trainer/network/teleop_logic.py" = "./teleop_logic.py"
"./cloner/main.py" = "./main.py"
"./cloner/state.py" = "./state.py"
"./cloner/sync.py" = "./sync.py"
"./cloner/table_logic.py" = "./table_logic.py"

[js_modules.main]
"./trainer/JS/ble.js" = "ble"
